server:
  port: ${PORT:8080}
  shutdown: graceful

spring:
  application:
    name: portfolio-api
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

app:
  cors:
    allowed-origins: ${FRONTEND_ORIGINS:http://localhost:5173}
  contact:
    to: ${CONTACT_TO:}
    from: ${CONTACT_FROM:${MAIL_USERNAME:}}
    brevo-api-key: ${BREVO_API_KEY:}
    brevo-api-url: ${BREVO_API_URL:https://api.brevo.com/v3/smtp/email}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-2.0-flash}
    timeout-seconds: ${GEMINI_TIMEOUT_SECONDS:20}

logging:
  level:
    root: INFO
    com.ajit.portfolio: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n"
