<!doctype html>
<html lang="en" data-theme="midnight">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Sora:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Apply the saved theme before first paint to avoid a flash -->
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('ajit-portfolio-theme');
          var allowed = ['midnight', 'emerald', 'ember', 'arctic'];
          if (allowed.indexOf(theme) !== -1) {
            document.documentElement.dataset.theme = theme;
          }
        } catch (error) {
          /* storage unavailable — keep the default theme */
        }
      })();
    </script>

    <!-- SEO -->
    <title>Ajit Birajdar — Full Stack Java Developer & ML Enthusiast</title>
    <meta name="description" content="Portfolio of Ajit Birajdar — Full Stack Java Developer and ML Enthusiast. Building scalable backend systems & intelligent web apps with Java, Spring Boot, React, and MongoDB." />
    <meta name="keywords" content="Ajit Birajdar, Full Stack Developer, Java Developer, Spring Boot, React, Machine Learning, Portfolio, KITCOE" />
    <meta name="author" content="Ajit Birajdar" />

    <!-- Open Graph -->
    <meta property="og:title" content="Ajit Birajdar — Full Stack Java Developer" />
    <meta property="og:description" content="Building scalable backend systems & intelligent web applications with Java, Spring Boot, and React." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ajit-birajdar.vercel.app" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Ajit Birajdar — Full Stack Java Developer" />
    <meta name="twitter:description" content="Building scalable backend systems & intelligent web applications." />

    <!-- Theme color -->
    <meta name="theme-color" content="#07070f" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
