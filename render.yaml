# Render Blueprint — deploys the Spring Boot API as a free-tier Docker web service.
# In the Render dashboard: New > Blueprint > connect this repo.
# Secrets marked `sync: false` are prompted for at creation and never stored in git.

services:
  - type: web
    name: portfolio-api
    runtime: docker
    plan: free
    region: singapore
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Browser origin(s) allowed to call this API — set to your Vercel domain.
      - key: FRONTEND_ORIGINS
        sync: false
      # Optional: enables real Gemini replies. Blank = frontend keyword fallback.
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      # Optional: enables the contact form to actually deliver mail.
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: CONTACT_TO
        sync: false
